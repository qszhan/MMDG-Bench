# Configuration for Early Fusion DG on Face Anti-Spoofing

task:
  name: "face_antispoofing"
  num_classes: 2   

dataset:
  name: "face_antispoofing" 
  data_root: "/path/to/FAS"
  # modalities: ["rgb", "depth", "ir"]
  modalities: ["rgb", "depth"]
  domains: ["CeFA", "SURF", "WMCA"]  
  use_extracted_features: false
  vit_feature_dim: 768
  image_size: 224
  normalize_mean: [0.485, 0.456, 0.406]  # ImageNet mean
  normalize_std: [0.229, 0.224, 0.225]   # ImageNet std

model: 
  use_pretrained_vit: true
  load_pretrained_path: "third_party/pretrained_models_fas/vit_base_patch16_224-pytorch-default-v1.tar.gz"
  freeze_vit_backbone: true
  freeze_vit_layers: -1
  shared_backbone: true
  backbone_configs:
    rgb:
      type: "vit_base"
      pretrained: true
    depth:
      type: "vit_base"
      pretrained: true
    ir:
      type: "vit_base"
      pretrained: true

  # Fusion configuration
  fusion_type: "bottleneck"  
  fusion_config:
    hidden_dim: 512
    num_bottlenecks: 4   
  head_config:
    hidden_dim: 256
    dropout: 0.5

training: 
  batch_size: 32
  num_epochs: 30
  learning_rate: 1.0e-4
  weight_decay:  1.0e-4 
  optimizer_type: "sam"   
  sam_rho: 0.05
  sam_adaptive: false 
  use_scheduler: true 
  source_domains: ["CeFA", "SURF"]   
  target_domain: "WMCA"   
  val_frequency: 1   
  save_frequency: 5   
algorithm:
  name: "early_fusion_dg"
  hidden_dim: 2048
  proj_dim: 128
  # Loss weights
  alpha_contrast: 2.0       # Weight for supervised contrastive loss
  alpha_trans: 1.0          # Weight for cross-modal translation loss
  ld: 0.1                  # Weight for modal gap losses

  # Contrastive learning
  temperature: 0.1
  use_contras: true

  # Cross-modal translation
  use_modtrans: true

  # GBL (Generalized Blending) - Dynamic modality weighting
  use_gblend: true
  gbl_momentum: 0.9

  # Mixup augmentation
  use_mixup: false
  mixup_alpha: 1
  mixup_weight: 0.5
  mixup_start_epoch: 0

  # Domain Contrastive Loss
  use_domain_contrastive: false
  domain_contrastive_weight: 0.05
  domain_contrastive_temp: 0.1

  # MIRO (Mutual Information Regularization)
  use_miro: false
  miro_weight: 0.5

  # MMD (Maximum Mean Discrepancy)
  use_mmd: false
  mmd_weight: 1.0
  use_adaptive_mmd: false

evaluation:
  batch_size: 64 

# Logging and checkpointing
logging:
  log_dir: "./logs/fas_early_fusion"
  use_wandb: false
  wandb_project: "mmdg_bench_fas_early"
  print_frequency: 10

checkpointing:
  checkpoint_dir: "./checkpoints/fas_early_fusion/mlp"
  save_best: true  # Save best model based on validation ACER
  save_last: true

# Reproducibility
seed: 0
deterministic: false