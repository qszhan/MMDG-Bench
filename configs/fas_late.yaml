# Configuration for Late Fusion DG on Face Anti-Spoofing

task:
  name: "face_antispoofing"
  num_classes: 2

dataset:
  name: "face_antispoofing"
  # Dataset root directory containing all FAS datasets
  data_root: "/path/to/FAS"
  modalities: ["rgb", "depth", "ir"]
 

  # Domains (datasets) for domain generalization
  domains: ["CeFA", "SURF", "WMCA"]  # CASIA-CeFA, CASIA-SURF, WMCA

  # Feature loading mode
  use_extracted_features: false  # Use pre-extracted ViT features

  vit_feature_dim: 768

  # Image preprocessing (for on-the-fly extraction)
  image_size: 224
  normalize_mean: [0.485, 0.456, 0.406]  # ImageNet mean
  normalize_std: [0.229, 0.224, 0.225]   # ImageNet std

model:
  # ViT backbone configuration

  use_pretrained_vit: true
  load_pretrained_path: "path/to/pretrained_models_fas"
  freeze_vit_backbone: true
  freeze_vit_layers: -1

  shared_backbone: true

  backbone_configs:
    rgb:
      type: "vit_base"
      pretrained: true
    depth:
      type: "vit_base"
      pretrained: true
    ir:
      type: "vit_base"
      pretrained: true

 
 

training:
  # Basic training parameters
  batch_size: 32
  num_epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4

  # Optimizer configuration
  optimizer_type: "sam"  # Options: "adam" or "sam"

  # SAM optimizer parameters (if using SAM)
  sam_rho: 0.05
  sam_adaptive: false

  # Learning rate scheduler
  use_scheduler: true

  # Domain generalization setup
  source_domains: ["CeFA", "SURF"]  # Will be overridden by command line
  target_domain: "WMCA"  # Will be overridden by command line

  # Validation and saving
  val_frequency: 1  # Validate every N epochs
  save_frequency: 5  # Save checkpoint every N epochs

# Algorithm-specific parameters for Late Fusion DG
algorithm:
  name: "late_fusion_dg"

  # Projection parameters
  hidden_dim: 2048
  proj_dim: 128

  # Loss weights
  alpha_contrast: 3.0       # Weight for supervised contrastive loss
  alpha_trans: 1.0          # Weight for cross-modal translation loss
  ld: 0.1                  # Weight for modal gap losses

  # Contrastive learning
  temperature: 0.1
  use_contras: true

  # Cross-modal translation
  use_modtrans: true

  # Domain contrastive loss
  use_dg_contrastive: false
  dg_contrastive_weight: 0.05
  dg_contrastive_temp: 0.1

  # MMD loss (Maximum Mean Discrepancy)
  use_mmd: false
  mmd_weight: 0.05
  mmd_kernel_num: 5
  mmd_kernel_mul: 2.0

  # Mixup augmentation
  use_mixup: false
  mixup_alpha: 1.0
  mixup_weight: 0.5

  # MIRO (Mutual Information Regularization)
  use_miro: false
  miro_weight: 1.0
  miro_var_init: 0.1

  # Fusion configuration "transformer_bottleneck"
  fusion_type: "bottleneck"
  fusion_hidden_dim: 512
  num_bottlenecks: 4
  dg_hidden_dim: 256  # For DG classifier in late fusion

  # GBL (Generalized Blending) - Dynamic modality weighting
  use_gblend: true
  gbl_momentum: 0.9

evaluation:
  batch_size: 64
  # Metrics: AUC, EER, HTER, APCER, BPCER, ACER, Accuracy
  # Automatically computed by FAS task

# Logging and checkpointing
logging:
  log_dir: "./logs/fas_late_fusion"
  use_wandb: false
  wandb_project: "mmdg_bench_fas_late"
  print_frequency: 10

checkpointing:
  checkpoint_dir: "./checkpoints/fas_late_fusion"
  save_best: true  # Save best model based on validation ACER
  save_last: true

# Reproducibility
seed: 0
deterministic: false
