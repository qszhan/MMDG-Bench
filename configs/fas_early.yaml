# Configuration for Early Fusion DG on Face Anti-Spoofing

task:
  name: "face_antispoofing"
  num_classes: 2  # Binary classification (live=0, spoof=1) with CrossEntropyLoss


dataset:
  name: "face_antispoofing"

  # Dataset root directory containing all FAS datasets
  # For use_extracted_features=true: Path to MMDG_Bench's pre-extracted features
  # For use_extracted_features=false: Path to Flex-Modal-FAS raw images
  data_root: "/data_raid/algorithm/workSpace/adamwang/QianshanZhan/MMDG/datasets/FAS"
  # modalities: ["rgb", "depth", "ir"]
  modalities: ["rgb", "depth"]

  # Domains (datasets) for domain generalization
  domains: ["CeFA", "SURF", "WMCA"]  # CASIA-CeFA, CASIA-SURF, WMCA

  # Feature loading mode
  # true: Use pre-extracted features (MMDG_Bench loaders + data_root points to features)
  # false: Use raw images (Flex-Modal-FAS loaders + data_root points to /scratch/project_2004030/)
  use_extracted_features: false

  # ViT configuration (for on-the-fly extraction if use_extracted_features=false)  "google/vit-base-patch16-224

  vit_feature_dim: 768

  # Image preprocessing (for on-the-fly extraction)
  image_size: 224
  normalize_mean: [0.485, 0.456, 0.406]  # ImageNet mean
  normalize_std: [0.229, 0.224, 0.225]   # ImageNet std

model:
  # ViT backbone configuration
  use_pretrained_vit: true
  load_pretrained_path: "third_party/pretrained_models_fas/vit_base_patch16_224-pytorch-default-v1.tar.gz"
  freeze_vit_backbone: true
  freeze_vit_layers: -1
  # Shared backbone: If true, use single ViT for all modalities (like Flex-Modal-FAS)
  # If false, use separate ViT for each modality
  shared_backbone: true

  backbone_configs:
    rgb:
      type: "vit_base"
      pretrained: true
    depth:
      type: "vit_base"
      pretrained: true
    ir:
      type: "vit_base"
      pretrained: true

  # Fusion configuration
  fusion_type: "bottleneck"  # Options: "concat", "attention", "bottleneck", "transformer_bottleneck"
  fusion_config:
    hidden_dim: 512
    num_bottlenecks: 4  # For bottleneck fusion

  # Classification head configuration
  head_config:
    hidden_dim: 256
    dropout: 0.5

training:
  # Basic training parameters
  batch_size: 32
  num_epochs: 20
  learning_rate: 1.0e-4
  weight_decay:  1.0e-4
  # Optimizer configuration
  optimizer_type: "sam"  # Options: "adam" or "sam"

  # SAM optimizer parameters (if using SAM)
  sam_rho: 0.05
  sam_adaptive: false

  # Learning rate scheduler
  use_scheduler: true

  # Domain generalization setup
  source_domains: ["CeFA", "SURF"]  # Will be overridden by command line
  target_domain: "WMCA"  # Will be overridden by command line

  # Validation and saving
  val_frequency: 1  # Validate every N epochs
  save_frequency: 5  # Save checkpoint every N epochs

# Algorithm-specific parameters for Early Fusion DG
algorithm:
  name: "early_fusion_dg"

  # Projection parameters
  hidden_dim: 2048
  proj_dim: 128

  # Loss weights
  alpha_contrast: 2.0       # Weight for supervised contrastive loss
  alpha_trans: 1.0          # Weight for cross-modal translation loss
  ld: 0.1                  # Weight for modal gap losses

  # Contrastive learning
  temperature: 0.1
  use_contras: true

  # Cross-modal translation
  use_modtrans: true

#  # Fusion configuration
#  fusion_type: "bottleneck"
#  fusion_hidden_dim: 512
#  num_bottlenecks: 4

  # GBL (Generalized Blending) - Dynamic modality weighting
  use_gblend: true
  gbl_momentum: 0.9

  # Mixup augmentation
  use_mixup: false
  mixup_alpha: 1
  mixup_weight: 0.5
  mixup_start_epoch: 0

  # Domain Contrastive Loss
  use_domain_contrastive: false
  domain_contrastive_weight: 0.05
  domain_contrastive_temp: 0.1

  # MIRO (Mutual Information Regularization)
  use_miro: false
  miro_weight: 0.5

  # MMD (Maximum Mean Discrepancy)
  use_mmd: false
  mmd_weight: 1.0
  use_adaptive_mmd: false

evaluation:
  batch_size: 64
  # Metrics: AUC, EER, HTER, APCER, BPCER, ACER, Accuracy
  # Automatically computed by FAS task

# Logging and checkpointing
logging:
  log_dir: "./logs/fas_early_fusion"
  use_wandb: false
  wandb_project: "mmdg_bench_fas_early"
  print_frequency: 10

checkpointing:
  checkpoint_dir: "./checkpoints/fas_early_fusion"
  save_best: true  # Save best model based on validation ACER
  save_last: true

# Reproducibility
seed: 0
deterministic: false